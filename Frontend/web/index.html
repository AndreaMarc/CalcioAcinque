<!DOCTYPE html>
<html lang="it">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="InCampo: convocazioni, presenze, gettoni e quote per le squadre della tua societa (calcio a 5, 7, 8 e 11).">
  <meta name="theme-color" content="#00D27F">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="InCampo">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="icons/brand.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="favicon.png">

  <title>InCampo</title>
  <link rel="manifest" href="manifest.json">

  <!-- Splash: mostrato finche' Flutter non disegna il primo frame (lo rimuove main.dart). -->
  <style>
    html, body { margin: 0; height: 100%; background: #0A0E0F; }
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: #0A0E0F;
      transition: opacity .25s ease-out;
    }
    #splash.out { opacity: 0; pointer-events: none; }
    #splash svg { width: 72px; height: 72px; }
    #splash b {
      font: 600 12px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
      letter-spacing: .22em; color: #9FA7A9;
    }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" rx="26" fill="#00D27F"/>
      <g fill="none" stroke="#0A0E0F" stroke-width="7" stroke-linecap="round">
        <path d="M14 50H27M73 50H86"/>
        <circle cx="50" cy="50" r="19"/>
      </g>
      <circle cx="50" cy="50" r="4.5" fill="#0A0E0F"/>
    </svg>
    <b>INCAMPO</b>
  </div>

  <script>
    // Rete di sicurezza: se Flutter non parte, lo splash non deve restare appeso.
    setTimeout(function () {
      var s = document.getElementById('splash');
      if (s) s.remove();
    }, 15000);

    // Registra il service worker delle notifiche.
    //
    // Prima qui c'era un unregister di TUTTI i service worker a ogni caricamento,
    // messo per evitare cache stantia: con le push non si puo' piu' fare, perche'
    // disiscrivere il worker cancella anche la subscription. Il caching di Flutter
    // e' disattivato a monte (--pwa-strategy=none nel Dockerfile), quindi non c'e'
    // piu' nulla da ripulire: si toglie solo l'eventuale worker di Flutter rimasto
    // dalle versioni precedenti.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (const registration of registrations) {
            const url = registration.active && registration.active.scriptURL;
            if (url && url.indexOf('flutter_service_worker.js') !== -1) {
              registration.unregister();
            }
          }
        });

        navigator.serviceWorker.register('push-sw.js').catch(function (e) {
          console.warn('Service worker notifiche non registrato:', e);
        });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
