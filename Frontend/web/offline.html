<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#00D27F">
  <title>InCampo</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0A0E0F; color: #F5F5F2;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding: 32px 24px; box-sizing: border-box; }
    svg { width: 72px; height: 72px; margin-bottom: 22px; }
    h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: .02em; }
    p { margin: 0 0 22px; color: #9FA7A9; max-width: 32ch; }
    button { font: inherit; font-weight: 600; color: #003D24; background: #00D27F; border: 0;
      border-radius: 14px; padding: 12px 22px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true">
      <rect width="100" height="100" rx="26" fill="#00D27F"/>
      <g fill="none" stroke="#0A0E0F" stroke-width="7" stroke-linecap="round">
        <path d="M14 50H27M73 50H86"/><circle cx="50" cy="50" r="19"/>
      </g>
      <circle cx="50" cy="50" r="4.5" fill="#0A0E0F"/>
    </svg>
    <h1>Sei senza rete</h1>
    <p>InCampo ha bisogno della connessione per leggere convocazioni e partite. Riprova quando torni in campo.</p>
    <button onclick="location.reload()">Riprova</button>
  </main>
</body>
</html>
