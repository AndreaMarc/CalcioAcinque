server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (anti-clickjacking, no MIME sniffing, referrer ridotto)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # Il service worker delle notifiche e il manifest non vanno mai messi in cache:
    # un push-sw.js vecchio resterebbe attivo per giorni e le notifiche cambierebbero
    # comportamento senza preavviso.
    location = /push-sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Lo scope di default e' la cartella dello script: qui serve tutta l'app
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # I file di Flutter (main.dart.js, flutter_bootstrap.js...) non hanno l'hash nel
    # nome: senza Cache-Control il browser li tiene per euristica, e l'app installata
    # su iPhone restava alla versione vecchia dopo un deploy. no-cache = si usa la
    # copia locale solo dopo aver chiesto al server (304 via ETag se non e' cambiata).
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
