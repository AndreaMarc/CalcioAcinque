name: frontend
description: "InCampo - convocazioni, presenze, gettoni e quote"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  dio: ^5.4.3+1
  go_router: ^14.2.0
  intl: ^0.19.0
  table_calendar: ^3.1.2
  shared_preferences: ^2.3.3
  fl_chart: ^0.68.0
  web: ^1.0.0
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Font bundlati: google_fonts li cerca qui per nome ({Famiglia}-{Peso}.ttf)
  # invece di scaricarli a runtime da Google (vedi allowRuntimeFetching in main.dart).
  # Licenza OFL nei due file OFL-*.txt della stessa cartella.
  assets:
    - assets/google_fonts/
